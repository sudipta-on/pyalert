[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyalert-mail"
version = "0.1.2"
description = "Zero-credential-leak email alerting for long-running ML/HPC jobs, powered by a user-owned Gmail Apps Script bridge."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Sudipta Majumder", email = "sudiptam.iitkgp.phy@gmail.com" }
]
keywords = [
    "monitoring", "alerting", "email", "gmail", "machine-learning",
    "hpc", "training", "gpu", "nvml", "notifications", "apps-script"
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.5",
    "build>=1.0",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/sudipta-on/pyalert"

[project.scripts]
pyalert-setup = "pyalert.config:main"

[tool.setuptools.packages.find]
include = ["pyalert*"]

[tool.setuptools.package-data]
pyalert = ["py.typed"]

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
warn_unused_ignores = true
